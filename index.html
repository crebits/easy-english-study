<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy English Study</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6eb; --text:#1b1f24; --muted:#5f6b7a;
  --accent:#2457d6; --accent-soft:#e8eefc; --ok:#1f8a4c; --ok-soft:#e5f5ec;
  --warn:#a15c00; --warn-soft:#fff3e0; --ko:#3d4a5c; --ko-bg:#f2f5f9;
  --pron-bg:#f6f2fb; --pron:#5a3f86; --gram-bg:#f1f7f2; --gram:#2f5a3a; --star:#e0a100;
  --en-size:1.18rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111418; --panel:#191d23; --line:#2a3039; --text:#e8ebef; --muted:#9aa5b3;
    --accent:#7aa2ff; --accent-soft:#1d2a47; --ok:#5fd08f; --ok-soft:#173326;
    --warn:#ffb85c; --warn-soft:#3a2a12; --ko:#c5cfdb; --ko-bg:#1f252d;
    --pron-bg:#251f30; --pron:#cbb6f0; --gram-bg:#1b2a20; --gram:#a9d8b4; --star:#ffcc33;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;height:100vh}
/* header */
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1.25rem;margin:0;white-space:nowrap}
header h1 a{color:inherit;text-decoration:none}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted);align-items:center}
.stats b{color:var(--text)}
.bar{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
header .menu-btn{display:none}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-top input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.filters{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lesson-list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.lesson-list li a{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.92rem;line-height:1.4}
.lesson-list li a:hover{background:var(--bg)}
.lesson-list li a.current{background:var(--accent-soft);outline:1px solid var(--accent)}
.lesson-list .no{color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-list .mark{font-size:.75rem;padding:1px 7px;border-radius:999px;white-space:nowrap}
.mark.done{background:var(--ok-soft);color:var(--ok)}
.mark.todo{background:var(--bg);color:var(--muted)}
.mark.pending{background:var(--warn-soft);color:var(--warn)}
.side-count{padding:6px 12px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
/* main */
main{overflow:auto;min-height:0}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px}
.card h3{font-size:1.05rem}
.lesson-head .num{color:var(--muted);font-size:.9rem}
.lesson-head h2{font-size:1.5rem;margin:4px 0 12px;line-height:1.35}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 14px;font-size:.92rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.small{font-size:.85rem;color:var(--muted)}
/* script */
.script-tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px}
.section-title{font-size:.95rem;color:var(--muted);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sent{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.sent.hit{outline:2px solid var(--accent)}
.sent-top{display:flex;gap:10px;align-items:flex-start}
.sent .idx{color:var(--muted);font-size:.8rem;min-width:28px;padding-top:4px;font-variant-numeric:tabular-nums}
.sent .en{font-size:var(--en-size);font-weight:500;line-height:1.5;flex:1;margin:0}
.star{border:0;background:none;font-size:1.2rem;color:var(--line);padding:0 2px;line-height:1}
.star[aria-pressed=true]{color:var(--star)}
.sent-btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 38px}
.sent-btns button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:2px 10px;font-size:.8rem}
.sent-btns button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.extra{margin:8px 0 0 38px;padding:8px 12px;border-radius:8px;font-size:.93rem}
.extra[hidden]{display:none}
.extra.ko{background:var(--ko-bg);color:var(--ko)}
.extra.pron{background:var(--pron-bg);color:var(--pron)}
.extra.gram{background:var(--gram-bg);color:var(--gram)}
.extra .lbl{font-size:.75rem;font-weight:700;margin-right:6px;opacity:.8}
.flag{margin:6px 0 0 38px;font-size:.82rem;color:var(--warn)}
.bottom-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.pager{color:var(--muted);font-variant-numeric:tabular-nums}
.result{padding:10px 0;border-top:1px solid var(--line)}
.result:first-child{border-top:0}
mark{background:#ffe58a;color:#000;border-radius:2px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat-tile .v{font-size:1.6rem;font-weight:700}
.stat-tile .k{color:var(--muted);font-size:.85rem}
.backdrop{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 20% 0 0;max-width:360px;z-index:20;transform:translateX(-102%);transition:transform .15s}
  .app.nav-open aside{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  header .menu-btn{display:inline-flex}
  header{padding:10px 16px}
  .bar{width:80px}
  .wrap{padding:16px 16px 80px}
  .sent-btns,.extra,.flag{margin-left:0}
  .hdr-actions{margin-left:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="btn menu-btn" id="menuBtn" aria-label="강의 목록 열기">☰ 목록</button>
    <h1><a href="#/">Easy English Study</a></h1>
    <div class="stats" id="stats"></div>
    <div class="hdr-actions">
      <a class="btn" href="#/favorites">★ 즐겨찾기</a>
    </div>
  </header>
  <aside id="sidebar" aria-label="강의 목차">
    <div class="side-top">
      <input id="listSearch" type="search" placeholder="강의 번호·제목 검색 (예: 12, conversation)">
      <div class="filters" id="filters">
        <button class="chip" data-f="all" aria-pressed="true">전체</button>
        <button class="chip" data-f="todo" aria-pressed="false">미완료</button>
        <button class="chip" data-f="done" aria-pressed="false">완료</button>
      </div>
      <button class="btn" id="fullSearchBtn" type="button">제목·스크립트 전체 검색 →</button>
    </div>
    <ul class="lesson-list" id="lessonList"></ul>
    <div class="side-count" id="sideCount"></div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<script>
let CATALOG = /*__CATALOG__*/null;
window.EES = {lessons:{}, search:null, addLesson(no, sections){ this.lessons[no] = sections; }, setSearch(d){ this.search = d; }};
</script>
<script>
window.EES_START = function(){
'use strict';
const LESSONS = CATALOG.lessons;            // 252개, 채널 순서
const TOTAL = LESSONS.length;
const byNo = new Map(LESSONS.map(l => [l.no, l]));
const KEY = 'easyEnglishStudy.v1';

/* ---------- 저장 ---------- */
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') return s; }catch(e){}
  return {};
}
const state = Object.assign({done:{}, visited:{}, last:null, lastSent:{}, favorites:{}, memos:{}}, loadState());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- 유틸 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(3,'0');
const ytUrl = l => 'https://www.youtube.com/watch?v=' + encodeURIComponent(l.id);
function hl(text, q){
  const t = esc(text); if (!q) return t;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  return t.replace(re, m => '<mark>' + m + '</mark>');
}
function fmtDur(s){ if(!s) return ''; const m = Math.floor(s/60), r = s%60; return m + '분 ' + r + '초'; }
function statusOf(l){
  if (state.done[l.no]) return {cls:'done', txt:'완료'};
  if (l.status !== 'ready') return {cls:'pending', txt: l.status === 'no-captions' ? '전사 필요' : l.status === 'blocked' ? '자막 수집 대기' : l.status === 'unchecked' ? '자막 확인 불가' : '준비 중'};
  return {cls:'todo', txt: state.visited[l.no] ? '학습 중' : '미학습'};
}
function allSentences(l){ const out=[]; sectionsOf(l).forEach(sec => sec.sentences.forEach(s => out.push(s))); return out; }

const loading = {};
function loadScript(src){
  if (!loading[src] && window.EES_LOAD) loading[src] = window.EES_LOAD(src).catch(e => { delete loading[src]; throw e; });
  if (!loading[src]) loading[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete loading[src]; rej(new Error(src)); };
    document.head.appendChild(el);
  });
  return loading[src];
}
function sectionsOf(l){ return EES.lessons[l.no] || []; }

/* ---------- 헤더 통계 ---------- */
function renderStats(){
  const done = Object.keys(state.done).filter(k => state.done[k]).length;
  const pct = TOTAL ? Math.round(done / TOTAL * 1000) / 10 : 0;
  const last = state.last && byNo.get(state.last);
  $('#stats').innerHTML =
    `<span>전체 강의 <b>${TOTAL}</b>개</span>` +
    `<span>완료 <b>${done}</b>개</span>` +
    `<span>진도 <b>${pct}%</b> <span class="bar"><i style="width:${pct}%"></i></span></span>` +
    `<span>마지막 학습: ${last ? `<a href="#/lesson/${last.no}">${last.no}강 ${esc(last.title)}</a>` : '없음'}</span>`;
}

/* ---------- 목차 ---------- */
let listFilter = 'all';
function renderList(){
  const q = $('#listSearch').value.trim().toLowerCase();
  const cur = currentNo();
  const items = LESSONS.filter(l => {
    if (listFilter === 'done' && !state.done[l.no]) return false;
    if (listFilter === 'todo' && state.done[l.no]) return false;
    if (!q) return true;
    if (/^\d+$/.test(q)) return String(l.no).startsWith(q) || l.no === +q;
    return l.title.toLowerCase().includes(q);
  });
  $('#lessonList').innerHTML = items.map(l => {
    const st = statusOf(l);
    return `<li><a href="#/lesson/${l.no}" class="${l.no===cur?'current':''}" ${l.no===cur?'aria-current="page"':''}>
      <span class="no">${l.no}</span><span>${esc(l.title)}</span><span class="mark ${st.cls}">${st.txt}</span></a></li>`;
  }).join('') || '<li class="small" style="padding:12px">검색 결과가 없습니다.</li>';
  const ready = LESSONS.filter(l => l.status === 'ready').length;
  $('#sideCount').textContent = `${items.length}개 표시 · 학습 자료 준비 ${ready}/${TOTAL}`;
  const c = $('#lessonList .current'); if (c) c.scrollIntoView({block:'nearest'});
}
$('#listSearch').addEventListener('input', renderList);
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  listFilter = b.dataset.f;
  document.querySelectorAll('#filters .chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderList();
});
$('#fullSearchBtn').addEventListener('click', () => { location.hash = '#/search?q=' + encodeURIComponent($('#listSearch').value.trim()); });
$('#menuBtn').addEventListener('click', () => $('#app').classList.toggle('nav-open'));
document.addEventListener('click', e => {
  const app = $('#app');
  if (app.classList.contains('nav-open') && !e.target.closest('aside') && !e.target.closest('#menuBtn')) app.classList.remove('nav-open');
});
$('#lessonList').addEventListener('click', e => { if (e.target.closest('a')) $('#app').classList.remove('nav-open'); });

/* ---------- 라우팅 ---------- */
function currentNo(){ const m = location.hash.match(/^#\/lesson\/(\d+)/); return m ? +m[1] : null; }
function route(){
  const h = location.hash || '#/';
  let m;
  saveScrollPos = null;
  if ((m = h.match(/^#\/lesson\/(\d+)(?:\/s(\d+))?/))) renderLesson(+m[1], m[2] ? +m[2] : null);
  else if (h.startsWith('#/favorites')) renderFavorites();
  else if ((m = h.match(/^#\/search\?q=(.*)$/))) renderSearch(decodeURIComponent(m[1]));
  else renderHome();
  renderList(); renderStats();
}
window.addEventListener('hashchange', route);

/* ---------- 홈 ---------- */
function renderHome(){
  document.title = 'Easy English Study';
  const done = Object.keys(state.done).filter(k => state.done[k]).length;
  const ready = LESSONS.filter(l => l.status === 'ready').length;
  const favs = Object.keys(state.favorites).length;
  const last = state.last && byNo.get(state.last);
  const next = LESSONS.find(l => !state.done[l.no] && l.status === 'ready');
  $('#view').innerHTML = `
    <div class="card"><h2>Easy English Study</h2>
      <p class="small" style="margin:0">유튜브 채널 <a href="https://www.youtube.com/@easyenglish551/videos" target="_blank" rel="noopener">@easyenglish551</a>의 영상 ${TOTAL}개를 채널 순서대로 공부하는 교재입니다. 영상은 유튜브에서 열립니다.</p></div>
    <div class="dash-grid" style="margin-bottom:16px">
      <div class="stat-tile"><div class="v">${TOTAL}</div><div class="k">전체 강의</div></div>
      <div class="stat-tile"><div class="v">${done}</div><div class="k">학습 완료</div></div>
      <div class="stat-tile"><div class="v">${TOTAL ? Math.round(done/TOTAL*1000)/10 : 0}%</div><div class="k">전체 진도율</div></div>
      <div class="stat-tile"><div class="v">${ready}</div><div class="k">학습 자료 준비된 강의</div></div>
      <div class="stat-tile"><div class="v">${favs}</div><div class="k">즐겨찾기 문장</div></div>
    </div>
    <div class="card"><h3>이어서 공부하기</h3><div class="row">
      ${last ? `<a class="btn primary" href="#/lesson/${last.no}${state.lastSent[last.no] ? '/s'+state.lastSent[last.no] : ''}">마지막 학습: ${last.no}강 ${esc(last.title)}</a>` : ''}
      ${next ? `<a class="btn" href="#/lesson/${next.no}">다음 미완료 강의: ${next.no}강</a>` : ''}
      <a class="btn" href="#/lesson/1">1강부터 시작</a>
    </div></div>
    <div class="card"><h3>사용 방법</h3><ul class="small" style="margin:0;padding-left:18px">
      <li>영어 원문은 항상 보입니다. 문장 아래 <b>번역 · 발음 · 문법</b> 버튼으로 하나씩 펼치고, 스크립트 위의 <b>전체</b> 버튼으로 한꺼번에 펼치거나 닫습니다.</li>
      <li>☆를 누르면 문장이 즐겨찾기에 저장됩니다. 완료 표시·즐겨찾기·마지막 위치는 이 브라우저(LocalStorage)에 저장됩니다.</li>
      <li>스크립트는 유튜브 <b>자동 생성 자막</b>에서 가져왔습니다. 자막이 깨진 문장에는 ⚠ 표시가 있습니다.</li>
    </ul></div>`;
  $('#main').scrollTop = 0;
}

/* ---------- 강의 ---------- */
let saveScrollPos = null;
let renderToken = 0;
function renderLesson(no, focusSent){
  const l = byNo.get(no);
  if (!l){ $('#view').innerHTML = `<div class="card"><p>${no}강은 없습니다. (1~${TOTAL}강)</p></div>`; return; }
  if (l.status === 'ready' && !EES.lessons[no]){
    const tok = ++renderToken;
    $('#view').innerHTML = '<div class="card small">강의 자료를 불러오는 중…</div>';
    loadScript(`lessons/${pad(no)}.js`)
      .then(() => { if (tok === renderToken && currentNo() === no) renderLesson(no, focusSent); })
      .catch(() => { $('#view').innerHTML = `<div class="card"><div class="notice">lessons/${pad(no)}.js 파일을 읽지 못했습니다. index.html과 lessons 폴더가 같은 위치에 있는지 확인해 주세요.</div></div>`; });
    return;
  }
  ++renderToken;
  state.last = no; state.visited[no] = true; save();
  document.title = l.title;
  const prev = byNo.get(no-1), next = byNo.get(no+1);
  const done = !!state.done[no];
  let body = '';
  if (l.status !== 'ready'){
    const why = l.status === 'no-captions'
      ? '이 영상에는 쓸 수 있는 영어 자막(직접 올린 자막·자동 생성 영어 자막)이 없습니다. <b>음성 전사 작업이 필요</b>하며, 확인되지 않은 스크립트는 넣지 않았습니다.'
      : l.status === 'blocked'
        ? '유튜브에 자동 생성 영어 자막이 있는 것은 확인했지만, 유튜브가 자동 수집을 막아 <b>아직 스크립트를 가져오지 못한</b> 강의입니다. 영상 페이지의 자막(CC)·스크립트 표시로 볼 수 있습니다.'
      : l.status === 'captions'
        ? '자동 생성 영어 자막은 확인했지만 아직 <b>분석(번역·발음·문법)이 끝나지 않은</b> 강의입니다. 확인되지 않은 내용은 넣지 않았습니다.'
        : '자동 도구로 이 영상의 자막 정보를 읽지 못했습니다(유튜브가 자동 접근을 막는 영상). <b>자막 확보가 필요</b>하며, 확인되지 않은 내용은 넣지 않았습니다.';
    body = `<div class="card"><div class="notice">미완성 강의 — ${why}</div>
      <p class="small" style="margin:10px 0 0">영상은 위 버튼으로 유튜브에서 볼 수 있고, 완료 표시는 지금도 쓸 수 있습니다.</p></div>`;
  } else {
    const sents = allSentences(l);
    let i = 0;
    const script = sectionsOf(l).map(sec => {
      const head = `<div class="section-title">${esc(sec.title)}</div>`;
      return head + sec.sentences.map(s => sentHtml(l, s, ++i)).join('');
    }).join('');
    body = `
      <h3 style="margin:8px 0 0">영어 스크립트 <span class="small">(${sents.length}문장 · 유튜브 자동 생성 자막 기준)</span></h3>
      <div class="script-tools" id="tools">
        <button class="btn" data-all="ko" aria-pressed="false">전체 번역 열기</button>
        <button class="btn" data-all="pron" aria-pressed="false">전체 발음 열기</button>
        <button class="btn" data-all="gram" aria-pressed="false">전체 문법 열기</button>
      </div>
      <div id="script">${script}</div>`;
  }
  $('#view').innerHTML = `
    <div class="card lesson-head">
      <div class="num">${no}강 / 전체 ${TOTAL}강 ${l.uploadDate ? '· 업로드 ' + l.uploadDate : ''} ${l.duration ? '· ' + fmtDur(l.duration) : ''}</div>
      <h2>${esc(l.title)}</h2>
      <div class="row">
        <a class="btn primary" href="${ytUrl(l)}" target="_blank" rel="noopener">▶ 유튜브에서 영상 보기</a>
        <span class="mark ${statusOf(l).cls}">${statusOf(l).txt}</span>
      </div>
    </div>
    ${body}
    <div class="card bottom-nav">
      <div class="row">
        <a class="btn" ${prev ? `href="#/lesson/${prev.no}"` : 'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>← 이전 강의</a>
        <a class="btn" ${next ? `href="#/lesson/${next.no}"` : 'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>다음 강의 →</a>
        <button class="btn" id="toListBtn" type="button">☰ 강의 목록</button>
      </div>
      <span class="pager">${no} / ${TOTAL}</span>
      <button class="btn ${done ? 'ok' : ''}" id="doneBtn" type="button">${done ? '✓ 학습 완료됨 (취소)' : '학습 완료 표시'}</button>
    </div>`;
  bindLesson(l);
  const main = $('#main');
  const target = focusSent || null;
  if (target){
    const el = document.getElementById('s' + target);
    if (el){ el.classList.add('hit'); el.scrollIntoView({block:'center'}); }
  } else main.scrollTop = 0;
  saveScrollPos = no;
}
function sentHtml(l, s, i){
  const fav = !!state.favorites[l.no + ':' + i];
  return `<div class="sent" id="s${i}" data-i="${i}">
    <div class="sent-top"><span class="idx">${i}</span><p class="en" lang="en">${esc(s.en)}</p>
      <button class="star" data-fav="${i}" aria-pressed="${fav}" title="즐겨찾기" aria-label="즐겨찾기">${fav ? '★' : '☆'}</button></div>
    ${s.flag ? `<div class="flag">⚠ ${esc(s.flag)}</div>` : ''}
    <div class="sent-btns">
      <button data-t="ko" aria-pressed="false">한국어 번역 보기</button>
      <button data-t="pron" aria-pressed="false">발음 보기</button>
      <button data-t="gram" aria-pressed="false">문법 설명 보기</button>
    </div>
    <div class="extra ko" data-x="ko" hidden><span class="lbl">번역</span>${esc(s.ko)}</div>
    <div class="extra pron" data-x="pron" hidden><span class="lbl">발음</span>${esc(s.pron)}</div>
    <div class="extra gram" data-x="gram" hidden><span class="lbl">문법</span>${esc(s.grammar)}</div>
  </div>`;
}
const T_LABEL = {ko:'한국어 번역', pron:'발음', gram:'문법 설명'};
const ALL_LABEL = {ko:'번역', pron:'발음', gram:'문법'};
function setSent(el, t, open){
  el.querySelector(`[data-x="${t}"]`).hidden = !open;
  const b = el.querySelector(`[data-t="${t}"]`);
  b.setAttribute('aria-pressed', open);
  b.textContent = T_LABEL[t] + (open ? ' 닫기' : ' 보기');
}
function bindLesson(l){
  const no = l.no;
  const script = $('#script');
  if (script){
    script.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const el = b.closest('.sent');
      if (b.dataset.t){ setSent(el, b.dataset.t, b.getAttribute('aria-pressed') !== 'true'); }
      else if (b.dataset.fav){
        const i = +b.dataset.fav, key = no + ':' + i;
        if (state.favorites[key]) delete state.favorites[key];
        else { const s = allSentences(l)[i-1]; state.favorites[key] = {no, i, en:s.en, ko:s.ko, t:Date.now()}; }
        save();
        const on = !!state.favorites[key];
        b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆';
        renderStats();
      }
    });
    $('#tools').addEventListener('click', e => {
      const b = e.target.closest('[data-all]'); if (!b) return;
      const t = b.dataset.all, open = b.getAttribute('aria-pressed') !== 'true';
      script.querySelectorAll('.sent').forEach(el => setSent(el, t, open));
      b.setAttribute('aria-pressed', open);
      b.textContent = '전체 ' + ALL_LABEL[t] + (open ? ' 닫기' : ' 열기');
    });
  }
  $('#doneBtn').addEventListener('click', () => {
    if (state.done[no]) delete state.done[no]; else state.done[no] = true;
    save(); route();
  });
  $('#toListBtn').addEventListener('click', () => {
    if (window.matchMedia('(max-width:860px)').matches) $('#app').classList.add('nav-open');
    else { $('#listSearch').focus(); const c = $('#lessonList .current'); if (c) c.scrollIntoView({block:'center'}); }
  });
}
/* 마지막 학습 위치(보고 있던 문장) 자동 저장 */
let scrollTimer;
$('#main').addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    if (saveScrollPos == null) return;
    const top = $('#main').getBoundingClientRect().top + 80;
    const sents = document.querySelectorAll('#script .sent');
    let cur = null;
    for (const el of sents){ if (el.getBoundingClientRect().bottom > top){ cur = +el.dataset.i; break; } }
    if (cur){ state.lastSent[saveScrollPos] = cur; save(); }
  }, 300);
});

/* ---------- 즐겨찾기 ---------- */
function renderFavorites(){
  document.title = 'Easy English Study';
  const favs = Object.values(state.favorites).sort((a,b) => a.no - b.no || a.i - b.i);
  $('#view').innerHTML = `<div class="card" id="favCard"><h2>★ 즐겨찾기 문장 (${favs.length})</h2>
    ${favs.length ? favs.map(f => { const l = byNo.get(f.no); return `<div class="result">
      <div class="small"><a href="#/lesson/${f.no}/s${f.i}">${f.no}강 ${esc(l ? l.title : '')} · ${f.i}번 문장</a></div>
      <div style="font-size:var(--en-size);font-weight:500" lang="en">${esc(f.en)}</div>
      <div class="small">${esc(f.ko)}</div>
      <button class="btn" data-unfav="${f.no}:${f.i}" style="margin-top:6px;padding:2px 10px;font-size:.8rem">즐겨찾기 해제</button></div>`; }).join('')
    : '<p class="small">강의 스크립트에서 ☆를 눌러 중요한 문장을 모아 보세요.</p>'}</div>`;
  $('#favCard').addEventListener('click', e => {
    const b = e.target.closest('[data-unfav]'); if (!b) return;
    delete state.favorites[b.dataset.unfav]; save(); route();
  });
  $('#main').scrollTop = 0;
}

/* ---------- 전체 검색 ---------- */
function renderSearch(q){
  document.title = 'Easy English Study';
  $('#view').innerHTML = `<div class="card"><h2>제목·스크립트 검색</h2>
    <form id="sForm" class="row"><input id="sInput" type="search" value="${esc(q)}" placeholder="영어 단어나 문장, 강의 제목" style="flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit">
    <button class="btn primary">검색</button></form><div id="sResults" style="margin-top:12px"></div></div>`;
  $('#sForm').addEventListener('submit', e => { e.preventDefault(); location.hash = '#/search?q=' + encodeURIComponent($('#sInput').value.trim()); });
  $('#sInput').focus();
  const out = $('#sResults');
  if (!q){ out.innerHTML = '<p class="small">검색어를 입력하세요. 학습 자료가 준비된 강의의 스크립트까지 검색합니다.</p>'; return; }
  out.innerHTML = '<p class="small">검색 자료를 불러오는 중…</p>';
  loadScript('search.js').then(() => searchNow(q, out))
    .catch(() => { out.innerHTML = '<div class="notice">search.js 파일을 읽지 못했습니다.</div>'; });
}
function searchNow(q, out){
  if (!location.hash.startsWith('#/search')) return;
  const ql = q.toLowerCase();
  const titleHits = LESSONS.filter(l => l.title.toLowerCase().includes(ql) || String(l.no) === q);
  const sentHits = [];
  for (const l of LESSONS){
    if (l.status !== 'ready') continue;
    (EES.search[l.no] || []).forEach((en, k) => { if (en.toLowerCase().includes(ql)) sentHits.push({l, s:{en}, i:k+1}); });
  }
  const LIMIT = 300;
  out.innerHTML = `<h3>강의 제목 (${titleHits.length})</h3>` +
    (titleHits.map(l => `<div class="result"><a href="#/lesson/${l.no}">${l.no}강 ${hl(l.title, q)}</a></div>`).join('') || '<p class="small">없음</p>') +
    `<h3 style="margin-top:18px">스크립트 문장 (${sentHits.length}${sentHits.length > LIMIT ? `, 앞 ${LIMIT}개 표시` : ''})</h3>` +
    (sentHits.slice(0, LIMIT).map(h => `<div class="result"><div class="small"><a href="#/lesson/${h.l.no}/s${h.i}">${h.l.no}강 · ${h.i}번 문장</a></div>
      <div lang="en">${hl(h.s.en, q)}</div></div>`).join('') || '<p class="small">없음</p>');
}

route();
};
if (CATALOG) EES_START();
</script>

<div id="gate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#f6f7f9);padding:16px">
  <form id="gateForm" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;font:16px system-ui,sans-serif">
    <h1 style="margin:0;font-size:22px">Easy English Study</h1>
    <input id="gatePw" type="password" autocomplete="current-password" placeholder="비밀번호" required
      style="font-size:16px;padding:12px;border:1px solid #bbb;border-radius:8px">
    <label style="font-size:14px"><input id="gateRemember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button id="gateBtn" style="font-size:16px;padding:12px;border:0;border-radius:8px;background:#2f6fde;color:#fff">열기</button>
    <div id="gateMsg" role="alert" style="font-size:14px;color:#c0392b;min-height:1em"></div>
  </form>
</div>
<script>
(function(){
const SALT = 'k4Rjwm1TMYjLPE7CQd1Vog==', ITER = 600000, KEYNAME = 'easyEnglishStudy.key';
const gate = document.getElementById('gate'), msg = document.getElementById('gateMsg'), btn = document.getElementById('gateBtn');
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
let key = null;
async function dec(path){
  const r = await fetch(path, {cache: 'no-cache'});
  if (!r.ok) throw new Error(path + ' ' + r.status);
  const b = new Uint8Array(await r.arrayBuffer());
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12)));
}
window.EES_LOAD = async src => { (0, eval)(await dec(src.replace(/\.js$/, '.bin'))); };
async function open(k){
  key = k;
  CATALOG = JSON.parse(await dec('catalog.bin'));
  gate.remove();
  EES_START();
}
function store(get, set){ try{ return set === undefined ? localStorage.getItem(get) : (set === null ? localStorage.removeItem(get) : localStorage.setItem(get, set)); }catch(e){ return null; } }
if (!window.crypto || !crypto.subtle){ msg.textContent = 'https 주소에서만 열 수 있습니다.'; btn.disabled = true; return; }
const saved = store(KEYNAME);
if (saved){
  crypto.subtle.importKey('raw', b64d(saved), 'AES-GCM', false, ['decrypt']).then(open)
    .catch(() => { store(KEYNAME, null); msg.textContent = '저장된 키가 맞지 않습니다. 비밀번호를 다시 입력해 주세요.'; });
}
document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true; msg.textContent = '';
  try{
    const remember = document.getElementById('gateRemember').checked;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('gatePw').value), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64d(SALT), iterations: ITER, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, remember, ['decrypt']);
    await open(k);
    if (remember) store(KEYNAME, b64e(await crypto.subtle.exportKey('raw', k)));
  }catch(err){
    msg.textContent = err instanceof DOMException && err.name === 'OperationError' ? '비밀번호가 틀렸습니다.' : '열지 못했습니다: ' + err.message;
    btn.disabled = false;
  }
});
})();
</script>
